<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Inner circle border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- Leaf/Plant element (left) -->
  <path d="M 70 80 Q 65 90 70 100 Q 75 110 85 115" 
        fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M 68 85 Q 62 88 65 95" 
        fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 80 78 Q 75 82 78 92" 
        fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Heart/Care element (center) -->
  <path d="M 100 95 C 100 85, 110 80, 115 80 C 120 80, 125 85, 125 90 C 125 100, 110 110, 100 120 C 90 110, 75 100, 75 90 C 75 85, 80 80, 85 80 C 90 80, 100 85, 100 95 Z"
        fill="rgba(255,255,255,0.3)" stroke="white" stroke-width="2"/>
  
  <!-- Leaf/Plant element (right) -->
  <path d="M 130 80 Q 135 90 130 100 Q 125 110 115 115" 
        fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M 132 85 Q 138 88 135 95" 
        fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 120 78 Q 125 82 122 92" 
        fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Decorative elements at bottom -->
  <circle cx="90" cy="130" r="2" fill="white" opacity="0.6"/>
  <circle cx="100" cy="135" r="2" fill="white" opacity="0.6"/>
  <circle cx="110" cy="130" r="2" fill="white" opacity="0.6"/>
  
  <!-- Letter K (stylized) -->
  <text x="50%" y="55%" font-family="'Playfair Display', serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="central" opacity="0.9">K</text>
  
  <!-- Letter O (stylized) -->
  <text x="50%" y="75%" font-family="'Playfair Display', serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="central" opacity="0.85">O</text>
</svg>